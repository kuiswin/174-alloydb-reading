services:
  # 1. Google AlloyDB Omni (魔改造PostgreSQL 15コンテナ)
  alloydb-db:
    image: google/alloydbomni:15
    container_name: alloydb-db
    ports:
      - "5432:5432" # Postgres標準ポート
    environment:
      - POSTGRES_DB=reading_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reading_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 2. AlloyDB & pgvector 拡張機能の自動有効化 + テーブル初期化
  alloydb-init:
    image: postgres:15-alpine
    container_name: alloydb-init
    depends_on:
      - alloydb-db
    entrypoint: >
      bash -c "
        echo 'Waiting for AlloyDB Omni to wake up...' &&
        until pg_isready -h alloydb-db -U postgres; do
          sleep 2
        done &&
        export PGPASSWORD=postgres &&
        psql -h alloydb-db -U postgres -d reading_db -c 'CREATE EXTENSION IF NOT EXISTS vector;' &&
        psql -h alloydb-db -U postgres -d reading_db -c 'CREATE EXTENSION IF NOT EXISTS pg_bigm;' &&
        psql -h alloydb-db -U postgres -d reading_db -c '
          CREATE TABLE IF NOT EXISTS reading_memos (
            id VARCHAR(36) PRIMARY KEY,
            title VARCHAR(200) NOT NULL,
            memo TEXT NOT NULL,
            embedding vector(384),
            created_at TIMESTAMPTZ NOT NULL
          );' &&
        echo '🔥 AlloyDB Omni & pgvector initialization completed successfully!'
      "

  # 3. Ollama (ローカルAI Embeddingsエンジン)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  # 4. Ollama モデル自動プル(初期化)
  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama service...' &&
        until curl -s http://ollama:11434/api/tags >/dev/null; do
          sleep 2
        done &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"all-minilm\"}' &&
        echo '🤖 Ollama Embeddings Model (all-minilm) Loaded Successfully!'
      "

  # 5. Go言語 REST API バックエンド
  go-api:
    build: .
    container_name: alloydb-go-api
    depends_on:
      alloydb-db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "80:80" # 読書メモ美麗UI / API用
    environment:
      - DATABASE_URL=postgres://postgres:postgres@alloydb-db:5432/reading_db?sslmode=disable
      - OLLAMA_URL=http://ollama:11434
    restart: always

volumes:
  ollama_data:
