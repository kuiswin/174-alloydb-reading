services:
  # 1. Google AlloyDB Omni (魔改造PostgreSQL 15コンテナ)
  alloydb-db:
    image: google/alloydbomni:15
    container_name: alloydb-db
    ports:
      - "127.0.0.1:5432:5432" # Postgres標準ポート（ホスト内ループバックにバインドし外部露出を制限）
    environment:
      - POSTGRES_DB=reading_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - ./alloydb_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M

  # 2. AlloyDB & pgvector 拡張機能の自動有効化 + テーブル初期化
  alloydb-init:
    image: postgres:15-alpine
    container_name: alloydb-init
    depends_on:
      - alloydb-db
    entrypoint: >
      sh -c "
        echo 'Waiting for AlloyDB Omni to wake up...' &&
        until pg_isready -h alloydb-db -U postgres; do
          sleep 2
        done &&
        export PGPASSWORD=postgres &&
        psql -h alloydb-db -U postgres -d reading_db -c 'CREATE EXTENSION IF NOT EXISTS vector;' &&
        psql -h alloydb-db -U postgres -d reading_db -c 'CREATE EXTENSION IF NOT EXISTS alloydb_scann;' &&
        psql -h alloydb-db -U postgres -d reading_db -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' &&
        psql -h alloydb-db -U postgres -d reading_db -c \"ALTER SYSTEM SET scann.enable_index_with_insufficient_data = 'on';\" &&
        psql -h alloydb-db -U postgres -d reading_db -c \"SELECT pg_reload_conf();\" &&
        psql -h alloydb-db -U postgres -d reading_db -c '
          CREATE TABLE IF NOT EXISTS reading_memos (
            id VARCHAR(36) PRIMARY KEY,
            title VARCHAR(200) NOT NULL,
            memo TEXT NOT NULL,
            embedding vector(768),
            created_at TIMESTAMPTZ NOT NULL
          );' &&
        psql -h alloydb-db -U postgres -d reading_db -c \"INSERT INTO reading_memos (id, title, memo, embedding, created_at) VALUES ('dummy1', 'dummy', 'dummy', array_fill(0::float4, ARRAY[768])::vector, now()), ('dummy2', 'dummy', 'dummy', array_fill(0::float4, ARRAY[768])::vector, now()) ON CONFLICT DO NOTHING;\" &&
        psql -h alloydb-db -U postgres -d reading_db -c \"SET scann.allow_blocked_operations = true; CREATE INDEX IF NOT EXISTS reading_memos_scann_idx ON reading_memos USING scann (embedding cosine) WITH (mode='MANUAL', num_leaves=4);\" &&
        psql -h alloydb-db -U postgres -d reading_db -c \"DELETE FROM reading_memos WHERE id LIKE 'dummy%';\" &&
        echo '🔥 AlloyDB Omni & pgvector/ScaNN initialization completed successfully!'
      "

  # 3. Ollama (ローカルAI Embeddingsエンジン)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434" # ポートのローカルループバック制限
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M

  # 4. Ollama モデル自動プル(初期化)
  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama service...' &&
        until curl -s http://ollama:11434/api/tags >/dev/null; do
          sleep 2
        done &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}' &&
        echo '🤖 Ollama Embeddings Model (nomic-embed-text) Loaded Successfully!'
      "

  # 5. Go言語 REST API バックエンド
  go-api:
    build: .
    container_name: alloydb-go-api
    depends_on:
      - alloydb-db
      - ollama
    ports:
      - "80:80" # 読書メモ美麗UI / API用
    environment:
      - DATABASE_URL=postgres://postgres:postgres@alloydb-db:5432/reading_db?sslmode=disable
      - OLLAMA_URL=http://ollama:11434
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  ollama_data:
